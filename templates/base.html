<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tontine Hero — Finances & Tontines</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-header">
    <div class="header-inner">
      <div style="display:flex; align-items:center; gap:2rem;">
        <a href="/" class="brand-title">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path>
            <path d="M12 6v2"></path>
            <path d="M12 16v2"></path>
          </svg>
          <span>Tontine<strong style="color:#34d399;">Hero</strong></span>
        </a>

        <!-- Desktop Navigation Bar -->
        <nav class="desktop-nav">
          <a href="/" class="nav-link {% if active_tab == 'dashboard' %}active{% endif %}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>
            <span>Tableau de bord</span>
          </a>
          <a href="/tontines" class="nav-link {% if active_tab == 'tontines' %}active{% endif %}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <span>Mes Tontines</span>
          </a>
          <a href="/budget" class="nav-link {% if active_tab == 'budget' %}active{% endif %}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"></rect><line x1="2" x2="22" y1="10" y2="10"></line></svg>
            <span>Budget & Dépenses</span>
          </a>
          <a href="/savings" class="nav-link {% if active_tab == 'savings' %}active{% endif %}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2h0V5z"></path><circle cx="9" cy="11" r="1"></circle></svg>
            <span>Épargne</span>
          </a>
          <a href="/simulator" class="nav-link {% if active_tab == 'simulator' %}active{% endif %}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="16" height="20" x="4" y="2" rx="2"></rect><line x1="8" x2="16" y1="6" y2="6"></line><line x1="16" x2="16" y1="14" y2="18"></line></svg>
            <span>Simulateur</span>
          </a>
        </nav>
      </div>

      <div class="header-actions">
        <!-- Currency -->
        <form action="/api/profile/currency" method="POST" style="margin:0;">
          <input type="hidden" name="redirect_to" value="{{ request.url.path }}" />
          <select name="currency" onchange="this.form.submit()" class="currency-select">
            <option value="XOF" {% if profile.currency == 'XOF' %}selected{% endif %}>FCFA</option>
            <option value="EUR" {% if profile.currency == 'EUR' %}selected{% endif %}>EUR (€)</option>
            <option value="USD" {% if profile.currency == 'USD' %}selected{% endif %}>USD ($)</option>
            <option value="GNF" {% if profile.currency == 'GNF' %}selected{% endif %}>GNF</option>
          </select>
        </form>

        <!-- User Initials -->
        <div class="user-avatar-initials" title="{{ profile.name }}">
          {{ profile.name[:2]|upper }}
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-container">
    {% block content %}{% endblock %}
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="/" class="nav-btn {% if active_tab == 'dashboard' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>
      <span>Accueil</span>
    </a>

    <a href="/tontines" class="nav-btn {% if active_tab == 'tontines' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span>Tontines</span>
    </a>

    <a href="/budget" class="nav-btn {% if active_tab == 'budget' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"></rect><line x1="2" x2="22" y1="10" y2="10"></line></svg>
      <span>Budget</span>
    </a>

    <a href="/savings" class="nav-btn {% if active_tab == 'savings' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2h0V5z"></path><circle cx="9" cy="11" r="1"></circle></svg>
      <span>Épargne</span>
    </a>

    <a href="/simulator" class="nav-btn {% if active_tab == 'simulator' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="16" height="20" x="4" y="2" rx="2"></rect><line x1="8" x2="16" y1="6" y2="6"></line><line x1="16" x2="16" y1="14" y2="18"></line></svg>
      <span>Calcul</span>
    </a>
  </nav>

  <!-- Modal: Add Transaction -->
  <div id="addTransactionModal" class="modal-overlay" style="display: none;" onclick="handleOverlayClick(event, 'addTransactionModal')">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
        <h3 style="font-size:1.15rem; font-weight:800; color:#ffffff;">Nouvelle Opération</h3>
        <button type="button" onclick="closeModal('addTransactionModal')" style="background:rgba(255,255,255,0.1); border:none; width:36px; height:36px; border-radius:50%; font-size:1.1rem; color:#ffffff; cursor:pointer; display:flex; align-items:center; justify-content:center;">✕</button>
      </div>

      <form action="/api/transactions" method="POST">
        <input type="hidden" name="redirect_to" value="{{ request.url.path }}" />

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; background:#0f172a; padding:0.25rem; border-radius:12px; margin-bottom:1rem; border:1px solid #334155;">
          <label style="display:flex; align-items:center; justify-content:center; padding:0.55rem; border-radius:9px; font-size:0.85rem; font-weight:700; cursor:pointer;" id="typeExpenseLabel">
            <input type="radio" name="type" value="expense" checked onchange="updateTypeSelector(this)" style="display:none;" />
            <span>Dépense</span>
          </label>
          <label style="display:flex; align-items:center; justify-content:center; padding:0.55rem; border-radius:9px; font-size:0.85rem; font-weight:700; cursor:pointer;" id="typeIncomeLabel">
            <input type="radio" name="type" value="income" onchange="updateTypeSelector(this)" style="display:none;" />
            <span>Revenu</span>
          </label>
        </div>

        <div class="form-group">
          <label class="form-label">Montant ({{ profile.currency }}) *</label>
          <input type="number" name="amount" required min="1" step="any" placeholder="Ex: 25000" class="form-input" style="font-size:1.25rem; font-weight:800;" />
        </div>

        <div class="form-group">
          <label class="form-label">Catégorie</label>
          <select name="category" class="form-select">
            <option value="Alimentation & Courses">Alimentation & Courses</option>
            <option value="Transport & Carburant">Transport & Carburant</option>
            <option value="Loyer & Charges">Loyer & Charges</option>
            <option value="Factures (Électricité/Eau)">Factures (Électricité/Eau)</option>
            <option value="Téléphone & Internet">Téléphone & Internet</option>
            <option value="Salaire / Mission">Salaire / Mission</option>
            <option value="Vente / Commerce">Vente / Commerce</option>
            <option value="Autre">Autre Dépense / Revenu</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Description (Optionnel)</label>
          <input type="text" name="description" placeholder="Ex: Courses, recharge..." class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" name="date" required value="{{ today_str }}" class="form-input" />
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-top:1.5rem;">
          <button type="button" onclick="closeModal('addTransactionModal')" class="btn btn-light">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function openModal(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'flex';
    }
    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }
    function handleOverlayClick(e, id) {
      if (e.target.id === id || e.target.classList.contains('modal-overlay')) {
        closeModal(id);
      }
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
      }
    });

    function updateTypeSelector(el) {
      const exp = document.getElementById('typeExpenseLabel');
      const inc = document.getElementById('typeIncomeLabel');
      if (el.value === 'expense') {
        exp.style.background = '#e11d48';
        exp.style.color = '#ffffff';
        inc.style.background = 'transparent';
        inc.style.color = '#94a3b8';
      } else {
        inc.style.background = '#059669';
        inc.style.color = '#ffffff';
        exp.style.background = 'transparent';
        exp.style.color = '#94a3b8';
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      const expRadio = document.querySelector('input[name="type"]:checked');
      if (expRadio) updateTypeSelector(expRadio);
    });
  </script>
</body>
</html>
